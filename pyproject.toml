[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vanta"
version = "0.1.0"
description = "Decentralized market intelligence, earned by accuracy. A Bittensor subnet for calibrated probabilistic forecasts."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    # starlette's TestClient requires httpx2; the runtime transport stays on httpx,
    # which is what the Bittensor signed-request recipe is written against.
    "httpx2>=2.12",
]
# Chain integration (Phase 5). Kept optional so the mechanism, the forecast engines and
# the historical simulation stay installable and testable without the Bittensor SDK.
#
# bittensor 11 removed the v10 axon/dendrite/synapse networking stack: subnets now bring
# their own HTTP layer and authenticate it with `bittensor.http_auth`. fastapi/uvicorn
# serve the miner endpoint (FastAPI is the backend §36 already specifies) and httpx is
# the validator's client. None of them are needed to run the mechanism or the simulation.
chain = [
    "bittensor==11.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["vanta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # starlette's TestClient imports a deprecated anyio alias internally. Third-party
    # code we cannot fix, matched on its exact message so nothing of ours is silenced.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
